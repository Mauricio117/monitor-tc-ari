name: Monitor tipo de cambio ARI

on:
  workflow_dispatch: {}   # disparado por cron-job.org vía API

concurrency:
  group: monitor-tc-ari
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Ejecutar monitor
        run: python3 monitor_tc_ari.py

      - name: Guardar estado (commit si cambió)
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add estado_tc_ari.json
          git diff --cached --quiet || git commit -m "Actualiza estado tipo de cambio [skip ci]"
          git pull --rebase origin main
          git push
