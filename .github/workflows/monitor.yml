name: Monitor tipo de cambio ARI

on:
  schedule:
    # Corre cada hora, en el minuto 0 (hora UTC).
    - cron: "0 * * * *"
  workflow_dispatch: {}   # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write   # necesario para que el workflow pueda hacer commit del estado

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 lxml
         
      - name: Instalar dependencias 2
        run: pip install requests pandas lxml

      - name: Ejecutar monitor
        run: python3 monitor_tc_ari.py

      - name: Guardar estado (commit si cambió)
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add estado_tc_ari.json
          git diff --cached --quiet || git commit -m "Actualiza estado tipo de cambio [skip ci]"
          git push
